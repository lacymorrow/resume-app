# CI Gate
#
# Runs on every pull request to main. Blocks merges when typecheck,
# tests, or the production build fails. `bun run build` runs
# `validate:resume` first, so a flavor overlay pointing at a renamed
# entry fails here instead of shipping a blank section.
#
# Vercel builds the preview build on every PR already, so `build` here
# is defense in depth; `typecheck` and `test` are not covered anywhere
# else.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # next-env.d.ts is gitignored, and it is what pulls in
      # next/image-types/global — the wildcard module declarations for .png,
      # .svg and friends. Without it a fresh checkout fails typecheck on every
      # image import ("Cannot find module '@/public/…'"), which is a missing
      # prerequisite rather than a real type error. typegen writes it without
      # running a full build.
      - name: Generate Next types
        run: bunx next typegen

      - name: Typecheck
        run: bun run typecheck

      # Scoped to the directories this app actually owns —
      # src/resume, src/app, src/config, scripts. The rest of src/
      # is inherited ShipKit surface (see LAC-3717) with pre-existing
      # errors that would drown out real signal. As LAC-3717 trims that
      # surface further, expand this to `bun run lint` and delete lint:ci.
      - name: Lint (owned directories)
        run: bun run lint:ci

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: "true"
