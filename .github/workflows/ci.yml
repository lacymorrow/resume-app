# CI Gate
#
# Runs on every pull request to main. Blocks merges when typecheck,
# tests, or the production build fails. `bun run build` runs
# `validate:resume` first, so a flavor overlay pointing at a renamed
# entry fails here instead of shipping a blank section.
#
# Vercel builds the preview build on every PR already, so `build` here
# is defense in depth; `typecheck` and `test` are not covered anywhere
# else.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: "true"
